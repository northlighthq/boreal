name: Dependencies

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  GOVULNCHECK: golang.org/x/vuln/cmd/govulncheck@v1.9.0

jobs:
  vulnerabilities:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - name: Install Gio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev

      - name: Scan
        shell: bash
        run: |
          go run "$GOVULNCHECK" ./...
          for dir in libs/*/; do
            (cd "$dir" && go run "$GOVULNCHECK" ./...)
          done
