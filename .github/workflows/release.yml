name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the v (0.1.1-beta.5)
        required: true
        type: string
      prerelease:
        description: Mark it as a pre-release
        type: boolean
        default: true
      dry_run:
        description: Build and test everything, but publish nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::$VERSION is not a valid version, use something like 0.1.1-beta.5"
            exit 1
          fi

          if [ "$DRY_RUN" != true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases are published from main. Use a dry run on other branches."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::The tag v$VERSION already exists"
            exit 1
          fi

          bash packaging/release-notes.sh "$VERSION" >/dev/null

  ci:
    needs: check
    uses: ./.github/workflows/ci.yml

  dependencies:
    needs: check
    uses: ./.github/workflows/dependencies.yml

  package:
    needs: [ci, dependencies]
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ inputs.version }}

  publish:
    if: ${{ !inputs.dry_run }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Sign
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: go run ./packaging/sign dist/boreal-* dist/platty-*

      - name: Publish
        run: |
          bash packaging/release-notes.sh "$VERSION" > notes.md
          flags=()

          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi

          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "Boreal $VERSION" --notes-file notes.md "${flags[@]}"

      - name: Date the changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git switch -C main origin/main
          sed -i "s/^## Unreleased$/## $VERSION ($(date -u +%F))/" CHANGELOG.md

          if ! git diff --quiet; then
            git commit -am "docs(changelog): release $VERSION"
            git push origin main
          fi
