name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Vet libraries
        shell: bash
        run: |
          for dir in libs/*/; do
            (cd "$dir" && go vet ./...)
          done

      - name: Tests
        shell: bash
        run: |
          go test ./...
          for dir in libs/*/; do
            (cd "$dir" && go test ./...)
          done

      - name: Benchmarks run once
        shell: bash
        run: |
          go test ./internal/common/termview -run '^$' -bench . -benchtime 1x
          (cd libs/vt && go test -run '^$' -bench . -benchtime 1x)

      - name: Build
        run: go build -ldflags "-H windowsgui" -o bin/boreal.exe ./cmd/boreal

      - name: Build for ARM64
        shell: bash
        run: GOARCH=arm64 go build -ldflags "-H windowsgui" -o bin/boreal-arm64.exe ./cmd/boreal

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Gio dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev

      - name: Vet
        run: go vet ./...

      - name: Vet libraries
        run: |
          for dir in libs/*/; do
            (cd "$dir" && go vet ./...)
          done

      - name: Tests
        run: |
          go test ./...
          for dir in libs/*/; do
            (cd "$dir" && go test ./...)
          done

      - name: Build
        run: go build -o bin/boreal ./cmd/boreal

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Vet libraries
        run: |
          for dir in libs/*/; do
            (cd "$dir" && go vet ./...)
          done

      - name: Tests
        run: |
          go test ./...
          for dir in libs/*/; do
            (cd "$dir" && go test ./...)
          done

      - name: Build
        run: go build -o bin/boreal ./cmd/boreal

      - name: Build for Intel
        run: CGO_ENABLED=1 GOARCH=amd64 CC="clang -arch x86_64" go build -o bin/boreal-amd64 ./cmd/boreal

  fuzz:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Tests
        run: |
          go test ./internal/core/backup ./internal/core/sshx ./internal/core/vault
          (cd libs/vt && go test ./...)

      - name: Fuzz the VT emulator
        working-directory: libs/vt
        run: go test -run '^$' -fuzz '^FuzzTerminal$' -fuzztime 30s .

      - name: Fuzz the metrics parser
        run: go test ./internal/core/sshx -run '^$' -fuzz '^FuzzParseStats$' -fuzztime 30s

      - name: Fuzz backup files
        run: go test ./internal/core/backup -run '^$' -fuzz '^FuzzParse$' -fuzztime 20s

      - name: Fuzz backup import
        run: go test ./internal/core/backup -run '^$' -fuzz '^FuzzDecodeAndMerge$' -fuzztime 30s
