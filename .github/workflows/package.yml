name: Package

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}
  LINUXDEPLOY: 1-alpha-20251107-1

jobs:
  linux:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Gio dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev

      - name: Build
        run: go build -trimpath -ldflags "-s -w -X github.com/northlighthq/boreal/internal/core/version.Version=$VERSION" -o build/boreal ./cmd/boreal

      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          ARCH: ${{ matrix.arch }}
        run: |
          curl -fsSL -o linuxdeploy "https://github.com/linuxdeploy/linuxdeploy/releases/download/$LINUXDEPLOY/linuxdeploy-$ARCH.AppImage"
          chmod +x linuxdeploy
          mkdir -p AppDir/usr/share/doc/boreal dist
          cp LICENSE THIRD_PARTY_NOTICES.md AppDir/usr/share/doc/boreal/
          LDAI_OUTPUT="dist/boreal-$VERSION-linux-$ARCH.AppImage" ./linuxdeploy --appdir AppDir -e build/boreal -d packaging/linux/boreal.desktop -i packaging/boreal.png --output appimage

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.AppImage
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Icon
        run: |
          mkdir -p build/boreal.iconset
          for s in 16 32 128 256; do
            sips -z $s $s packaging/boreal.png --out build/boreal.iconset/icon_${s}x${s}.png >/dev/null
          done
          for s in 16 32 128; do
            d=$((s * 2))
            sips -z $d $d packaging/boreal.png --out build/boreal.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns build/boreal.iconset -o build/boreal.icns

      - name: Build and package
        run: |
          mkdir -p dist
          for arch in arm64 amd64; do
            label=$([ "$arch" = arm64 ] && echo apple-silicon || echo intel)
            app="build/$arch/Boreal.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            CGO_ENABLED=1 GOARCH=$arch CC="clang -arch $([ "$arch" = amd64 ] && echo x86_64 || echo arm64)" \
              go build -trimpath -ldflags "-s -w -X github.com/northlighthq/boreal/internal/core/version.Version=$VERSION" -o "$app/Contents/MacOS/boreal" ./cmd/boreal
            sed "s/VERSION/${VERSION%%-*}/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
            cp build/boreal.icns "$app/Contents/Resources/boreal.icns"
            cp LICENSE THIRD_PARTY_NOTICES.md "$app/Contents/Resources/"
            codesign --force --deep --sign - "$app"
            mkdir -p "build/dmg-$arch"
            cp -R "$app" "build/dmg-$arch/"
            ln -s /Applications "build/dmg-$arch/Applications"
            hdiutil create -volname Boreal -srcfolder "build/dmg-$arch" -ov -format UDZO "dist/boreal-$VERSION-macos-$label.dmg"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build and package
        shell: pwsh
        run: ./packaging/build.ps1 -Version $env:VERSION -Installer

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error
